<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LiftLog</title>
<meta name="description" content="A fast, installable gym workout tracker with exercise animations and GitHub-backed sync.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div id="topbar-left">
      <h1 id="view-title">Home</h1>
      <div id="view-sub"></div>
    </div>
    <div id="topbar-right">
      <button id="sync-chip" class="sync-chip" type="button" title="Sync status" hidden>
        <span class="sync-dot"></span><span class="sync-label">Sync</span>
      </button>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M15 4.5v5M9 14.5v5"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <button id="resume-bar" class="resume-bar" type="button" hidden>
    <span class="resume-pulse"></span>
    <span class="resume-text">Workout in progress</span>
    <span class="resume-time mono">0:00</span>
    <span class="resume-cta">Resume</span>
  </button>

  <nav id="tabbar">
    <button class="tab" data-route="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2-5 3 10 2.5-7 1.5 2h4"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-route="routines" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
      <span>Routines</span>
    </button>
    <button class="tab tab-primary" data-action="start" type="button" aria-label="Start workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Start</span>
    </button>
    <button class="tab" data-route="history" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9M9 18V5M14 18v-6M19 18v-9"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-route="library" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <span>Library</span>
    </button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
